<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Rainbow Rush</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #08071b;
        overscroll-behavior: none;
      }

      body {
        display: grid;
        place-items: center;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }

      body::before {
        display: none;
        color: #fff;
        text-align: center;
        white-space: pre;
        padding: 24px;
        content: "ROTATE DEVICE OR EXPAND WINDOW\A RAINBOW RUSH PLAYS IN LANDSCAPE";
        font: 900 18px system-ui;
        line-height: 2;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        max-width: 177.78dvh;
        max-height: 100%;
        aspect-ratio: 16 / 9;
        cursor: default;
        touch-action: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      @media (orientation: portrait) {
        body::before {
          display: block;
        }

        canvas {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="540"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
